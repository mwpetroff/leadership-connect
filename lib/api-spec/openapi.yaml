openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Leadership Engagement Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: people
    description: Employee and leader management
  - name: events
    description: In-person event management
  - name: invitations
    description: Event invitation and attendance tracking
  - name: virtualMeetings
    description: Virtual meeting management
  - name: dashboard
    description: Summary and analytics
  - name: suggestions
    description: Smart engagement suggestions
  - name: settings
    description: Operational configuration
  - name: auditLog
    description: Admin audit trail
  - name: departments
    description: HR-owned org units and per-department cadences

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── People ───────────────────────────────────────────────────────────────
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List all people
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [executive, secondary_leader, staff]
        - in: query
          name: search
          schema:
            type: string
        - $ref: "#/components/parameters/Lens"
        - $ref: "#/components/parameters/DepartmentIds"
        - $ref: "#/components/parameters/LeaderId"
        - $ref: "#/components/parameters/HrbpId"
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: List of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a new person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{id}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /people/{id}/engagement:
    get:
      operationId: getPersonEngagement
      tags: [people]
      summary: Get engagement history for a person
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Engagement history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonEngagement"
        "404":
          description: Not found

  # ─── Events ───────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      parameters:
        - in: query
          name: upcoming
          schema:
            type: boolean
        - in: query
          name: type
          schema:
            type: string
        - $ref: "#/components/parameters/Lens"
        - $ref: "#/components/parameters/DepartmentIds"
        - $ref: "#/components/parameters/LeaderId"
        - $ref: "#/components/parameters/HrbpId"
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /events/{id}/leaders:
    get:
      operationId: listEventLeaders
      tags: [events]
      summary: List leaders attending an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of leaders at this event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"

  /events/{eventId}/leaders/{personId}:
    post:
      operationId: addEventLeader
      tags: [events]
      summary: Add a leader to an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
        - in: path
          name: personId
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Leader added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventLeader"
        "409":
          description: Already added
    delete:
      operationId: removeEventLeader
      tags: [events]
      summary: Remove a leader from an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
        - in: path
          name: personId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found

  /events/{eventId}/sponsors:
    get:
      operationId: listEventSponsors
      tags: [events]
      summary: List sponsors for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sponsors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventPersonSummary"
    post:
      operationId: addEventSponsor
      tags: [events]
      summary: Add a sponsor to an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSponsorInput"
      responses:
        "201":
          description: Sponsor added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSponsor"
        "404":
          description: Event not found

  /events/{eventId}/sponsors/{personId}:
    delete:
      operationId: removeEventSponsor
      tags: [events]
      summary: Remove a sponsor from an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
        - in: path
          name: personId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ─── Invitations ──────────────────────────────────────────────────────────
  /events/{id}/invitations:
    get:
      operationId: listEventInvitations
      tags: [invitations]
      summary: List all invitations for an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite a person to an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"

  /events/{id}/invitations/bulk:
    post:
      operationId: bulkCreateInvitations
      tags: [invitations]
      summary: Invite multiple people to an event in a single transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInvitationInput"
      responses:
        "201":
          description: Bulk invitations result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInvitationResult"
    patch:
      operationId: bulkUpdateInvitations
      tags: [invitations]
      summary: Update attendance status for multiple invitations in one call
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInvitationStatusInput"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInvitationStatusResult"

  /invitations/{id}:
    patch:
      operationId: updateInvitation
      tags: [invitations]
      summary: Update attendance status for an invitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          description: Not found
    delete:
      operationId: deleteInvitation
      tags: [invitations]
      summary: Remove an invitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Virtual Meetings ─────────────────────────────────────────────────────
  /virtual-meetings:
    get:
      operationId: listVirtualMeetings
      tags: [virtualMeetings]
      summary: List all virtual meetings
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [suggested, scheduled, completed, cancelled]
        - $ref: "#/components/parameters/Lens"
        - $ref: "#/components/parameters/DepartmentIds"
        - $ref: "#/components/parameters/LeaderId"
        - $ref: "#/components/parameters/HrbpId"
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: List of virtual meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualMeeting"
    post:
      operationId: createVirtualMeeting
      tags: [virtualMeetings]
      summary: Create a virtual meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualMeetingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMeeting"

  /virtual-meetings/{id}:
    get:
      operationId: getVirtualMeeting
      tags: [virtualMeetings]
      summary: Get a virtual meeting by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Virtual meeting found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMeeting"
        "404":
          description: Not found
    patch:
      operationId: updateVirtualMeeting
      tags: [virtualMeetings]
      summary: Update a virtual meeting
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualMeetingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMeeting"
        "404":
          description: Not found
    delete:
      operationId: deleteVirtualMeeting
      tags: [virtualMeetings]
      summary: Delete a virtual meeting
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /virtual-meetings/{id}/participants:
    get:
      operationId: listVirtualMeetingParticipants
      tags: [virtualMeetings]
      summary: List participants in a virtual meeting
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: addVirtualMeetingParticipant
      tags: [virtualMeetings]
      summary: Add a participant to a virtual meeting
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantInput"
      responses:
        "201":
          description: Participant added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualMeetingParticipant"

  /virtual-meetings/{meetingId}/participants/{personId}:
    delete:
      operationId: removeVirtualMeetingParticipant
      tags: [virtualMeetings]
      summary: Remove a participant from a virtual meeting
      parameters:
        - in: path
          name: meetingId
          required: true
          schema:
            type: integer
        - in: path
          name: personId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ─── Settings ─────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: List all configuration settings
      responses:
        "200":
          description: All settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"

  /settings/{key}:
    patch:
      operationId: updateSetting
      tags: [settings]
      summary: Update a single setting value
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "404":
          description: Unknown key

  # ─── Audit Log ────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [auditLog]
      summary: List audit log entries (admin only)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: resourceType
          schema:
            type: string
        - in: query
          name: actorId
          schema:
            type: string
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  # ─── Dashboard ────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level engagement summary and stats
      parameters:
        - $ref: "#/components/parameters/Lens"
        - $ref: "#/components/parameters/DepartmentIds"
        - $ref: "#/components/parameters/LeaderId"
        - $ref: "#/components/parameters/HrbpId"
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── Suggestions ──────────────────────────────────────────────────────────
  /suggestions/meetups:
    get:
      operationId: getMeetupSuggestions
      tags: [suggestions]
      summary: Suggest in-person meetups based on event proximity
      responses:
        "200":
          description: List of meetup suggestions grouped by event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetupSuggestion"

  /suggestions/virtual:
    get:
      operationId: getVirtualSuggestions
      tags: [suggestions]
      summary: Suggest virtual meetings for staff with no recent touchpoints
      responses:
        "200":
          description: List of people who need virtual touchpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualSuggestion"

  /suggestions/coverage:
    get:
      operationId: getCoverageSuggestions
      tags: [suggestions]
      summary: Ranked coverage-clock gaps for the current lens
      parameters:
        - $ref: "#/components/parameters/Lens"
        - $ref: "#/components/parameters/DepartmentIds"
        - $ref: "#/components/parameters/LeaderId"
        - $ref: "#/components/parameters/HrbpId"
        - $ref: "#/components/parameters/IncludeInactive"
      responses:
        "200":
          description: People with overdue coverage clocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSuggestions"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List HR-maintained departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department (admin; blocked if people are assigned)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: People still assigned

components:
  parameters:
    Lens:
      in: query
      name: lens
      schema:
        type: string
        enum: [my_team, departments, leader, hrbp, all]
        default: my_team
    DepartmentIds:
      in: query
      name: departmentIds
      schema:
        type: string
        description: Comma-separated department ids (departments lens)
    LeaderId:
      in: query
      name: leaderId
      schema:
        type: integer
    HrbpId:
      in: query
      name: hrbpId
      schema:
        type: integer
    IncludeInactive:
      in: query
      name: includeInactive
      schema:
        type: boolean
        default: false
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        parentId:
          type: ["integer", "null"]
        leadershipOneOnOneDays:
          type: ["integer", "null"]
        skipLevelDays:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: integer
          nullable: true
        leadershipOneOnOneDays:
          type: integer
          nullable: true
        skipLevelDays:
          type: integer
          nullable: true

    # ─── Person ─────────────────────────────────────────────────────────────
    Person:
      type: object
      required: [id, name, email, role, homeCity, homeState, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        title:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
          description: Department display name (derived from departmentId)
        departmentId:
          type: ["integer", "null"]
        hrbpId:
          type: ["integer", "null"]
        hrbpName:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        isHrbp:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        role:
          type: string
          enum: [executive, secondary_leader, staff]
        homeCity:
          type: string
        homeState:
          type: string
        managerId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonInput:
      type: object
      required: [name, email, role, homeCity, homeState]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        title:
          type: string
        department:
          type: string
          description: Department name; resolved to departmentId. Unknown names are rejected.
        departmentId:
          type: integer
          nullable: true
        hrbpId:
          type: integer
          nullable: true
        isHrbp:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        role:
          type: string
          enum: [executive, secondary_leader, staff]
        homeCity:
          type: string
          minLength: 1
        homeState:
          type: string
          minLength: 1
        managerId:
          type: integer
          nullable: true
        notes:
          type: string

    PersonUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        title:
          type: string
        department:
          type: string
        departmentId:
          type: integer
          nullable: true
        hrbpId:
          type: integer
          nullable: true
        isHrbp:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        role:
          type: string
          enum: [executive, secondary_leader, staff]
        homeCity:
          type: string
        homeState:
          type: string
        managerId:
          type: integer
          nullable: true
        notes:
          type: string

    PersonEngagement:
      type: object
      required: [person, invitations, virtualMeetings, daysSinceLastTouchpoint]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        virtualMeetings:
          type: array
          items:
            $ref: "#/components/schemas/VirtualMeeting"
        daysSinceLastTouchpoint:
          type: ["integer", "null"]
        totalInPersonAttended:
          type: integer
        totalVirtualCompleted:
          type: integer

    # ─── Event ──────────────────────────────────────────────────────────────
    EventPersonSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: ["string", "null"]
        role:
          type: string

    VenueSummary:
      type: object
      required: [id, name, address, city, state]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: ["string", "null"]
        webLink:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EventSponsorInput:
      type: object
      required: [personId]
      properties:
        personId:
          type: integer

    EventSponsor:
      type: object
      required: [eventId, personId]
      properties:
        eventId:
          type: integer
        personId:
          type: integer

    Event:
      type: object
      required: [id, name, location, city, state, startDate, eventType, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: string
        city:
          type: string
        state:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        eventType:
          type: string
          enum: [summit, conference, marketing, leadership, regional, other]
        venueId:
          type: ["integer", "null"]
        eveningVenueId:
          type: ["integer", "null"]
        organizerId:
          type: ["integer", "null"]
        venue:
          $ref: "#/components/schemas/VenueSummary"
        eveningVenue:
          $ref: "#/components/schemas/VenueSummary"
        sponsors:
          type: array
          items:
            $ref: "#/components/schemas/EventPersonSummary"
        organizer:
          $ref: "#/components/schemas/EventPersonSummary"
        leaderCount:
          type: integer
        inviteeCount:
          type: integer
        attendeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    EventInput:
      type: object
      required: [name, startDate, eventType]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
        city:
          type: string
        state:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        eventType:
          type: string
          enum: [summit, conference, marketing, leadership, regional, other]
        venueId:
          type: integer
        eveningVenueId:
          type: integer
        organizerId:
          type: integer
        sponsorIds:
          type: array
          items:
            type: integer

    EventUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
        city:
          type: string
        state:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        eventType:
          type: string
          enum: [summit, conference, marketing, leadership, regional, other]
        venueId:
          type: ["integer", "null"]
        eveningVenueId:
          type: ["integer", "null"]
        organizerId:
          type: ["integer", "null"]

    EventLeader:
      type: object
      required: [eventId, personId]
      properties:
        eventId:
          type: integer
        personId:
          type: integer
        addedAt:
          type: string
          format: date-time

    # ─── Invitation ──────────────────────────────────────────────────────────
    Invitation:
      type: object
      required: [id, eventId, personId, status, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        personId:
          type: integer
        status:
          type: string
          enum: [invited, attended, no_show, declined]
        notes:
          type: ["string", "null"]
        graphEventId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        person:
          $ref: "#/components/schemas/Person"
        event:
          $ref: "#/components/schemas/Event"

    InvitationInput:
      type: object
      required: [personId]
      properties:
        personId:
          type: integer
        notes:
          type: string
        createCalendarEvent:
          type: boolean
          description: "If true (default), create an Outlook calendar event via Microsoft Graph for this invitation."

    InvitationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [invited, attended, no_show, declined]
        notes:
          type: string

    BulkInvitationInput:
      type: object
      required: [personIds]
      properties:
        personIds:
          type: array
          items:
            type: integer
          minItems: 1
        createCalendarEvent:
          type: boolean
          description: "If true (default), create Outlook calendar events for each new invitation."

    BulkInvitationResult:
      type: object
      required: [created, skipped, invitations]
      properties:
        created:
          type: integer
          description: Number of new invitations created.
        skipped:
          type: integer
          description: Number of people already invited (skipped, not re-invited).
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    BulkInvitationStatusInput:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id:
                type: integer
              status:
                type: string
                enum: [invited, attended, no_show, declined]
          minItems: 1

    BulkInvitationStatusResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: Number of invitation statuses updated.

    # ─── Virtual Meeting ─────────────────────────────────────────────────────
    VirtualMeeting:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        scheduledDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [suggested, scheduled, completed, cancelled]
        notes:
          type: ["string", "null"]
        hostId:
          type: ["integer", "null"]
        host:
          $ref: "#/components/schemas/Person"
        participantCount:
          type: integer
        teamsJoinUrl:
          type: ["string", "null"]
          description: "Microsoft Teams meeting join URL, populated when the meeting is scheduled via Graph API."
        graphMeetingId:
          type: ["string", "null"]
          description: "Microsoft Graph online meeting ID for cancellation."
        meetingKind:
          type: string
          enum: [general, hrbp_1on1, leader_1on1, skip_level]
          description: Coverage-clock classification. general is the legacy default.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VirtualMeetingInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          format: date
        status:
          type: string
          enum: [suggested, scheduled, completed, cancelled]
        notes:
          type: string
        hostId:
          type: integer
        meetingKind:
          type: string
          enum: [general, hrbp_1on1, leader_1on1, skip_level]

    VirtualMeetingUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          format: date
        status:
          type: string
          enum: [suggested, scheduled, completed, cancelled]
        notes:
          type: string
        hostId:
          type: integer
        meetingKind:
          type: string
          enum: [general, hrbp_1on1, leader_1on1, skip_level]

    VirtualMeetingParticipant:
      type: object
      required: [meetingId, personId]
      properties:
        meetingId:
          type: integer
        personId:
          type: integer
        addedAt:
          type: string
          format: date-time

    ParticipantInput:
      type: object
      required: [personId]
      properties:
        personId:
          type: integer

    # ─── Dashboard ───────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalPeople, totalEvents, upcomingEvents, recentActivity, engagementByRole, needsTouchpoint]
      properties:
        totalPeople:
          type: integer
        totalEvents:
          type: integer
        upcomingEvents:
          type: integer
        totalExecutives:
          type: integer
        totalSecondaryLeaders:
          type: integer
        totalStaff:
          type: integer
        staffNeedingTouchpoint:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        engagementByRole:
          type: array
          items:
            $ref: "#/components/schemas/RoleEngagement"
        needsTouchpoint:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        coverage:
          $ref: "#/components/schemas/DashboardCoverage"

    DashboardCoverage:
      type: object
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        people:
          type: array
          items:
            $ref: "#/components/schemas/CoveragePersonRow"

    ActivityItem:
      type: object
      required: [type, description, timestamp]
      properties:
        type:
          type: string
          enum: [invitation, attendance, virtual_meeting, person_added, event_added]
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        personName:
          type: ["string", "null"]
        eventName:
          type: ["string", "null"]

    RoleEngagement:
      type: object
      required: [role, total, recentlyEngaged, neverEngaged]
      properties:
        role:
          type: string
        total:
          type: integer
        recentlyEngaged:
          type: integer
        neverEngaged:
          type: integer

    # ─── Settings ────────────────────────────────────────────────────────────
    Setting:
      type: object
      required: [key, value, updatedAt]
      properties:
        key:
          type: string
        value:
          type: string
        updatedAt:
          type: string
          format: date-time

    SettingUpdate:
      type: object
      required: [value]
      properties:
        value:
          type: string

    # ─── Audit Log ───────────────────────────────────────────────────────────
    AuditLogEntry:
      type: object
      required: [id, actorId, actorName, action, resourceType, resourceId, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: string
        actorName:
          type: string
        action:
          type: string
          enum: [create, update, delete]
        resourceType:
          type: string
        resourceId:
          type: string
        before:
          description: Row snapshot before the change (null for creates)
        after:
          description: Row snapshot after the change (null for deletes)
        createdAt:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ─── Suggestions ─────────────────────────────────────────────────────────
    CoverageGapKind:
      type: string
      enum: [hrbp_1on1, leader_1on1, skip_level, onsite_leadership]

    CoverageGap:
      type: object
      required: [kind, thresholdDays, overdue, notApplicable]
      properties:
        kind:
          $ref: "#/components/schemas/CoverageGapKind"
        daysSince:
          type: ["integer", "null"]
        thresholdDays:
          type: integer
        overdue:
          type: boolean
        notApplicable:
          type: boolean
        label:
          type: string

    CoveragePersonRow:
      type: object
      required: [overdueCount, gaps]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        overdueCount:
          type: integer
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/CoverageGap"

    CoverageCadences:
      type: object
      properties:
        hrbp_1on1:
          type: integer
        leader_1on1:
          type: integer
        skip_level:
          type: integer
        onsite_leadership:
          type: integer

    CoverageSuggestions:
      type: object
      required: [people]
      properties:
        org:
          $ref: "#/components/schemas/CoverageCadences"
        people:
          type: array
          items:
            $ref: "#/components/schemas/CoveragePersonRow"

    MeetupSuggestion:
      type: object
      required: [event, suggestedPeople, leaders]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        leaders:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        suggestedPeople:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedPerson"

    SuggestedPerson:
      type: object
      required: [person, reason, daysSinceLastEvent]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        reason:
          type: string
        daysSinceLastEvent:
          type: ["integer", "null"]

    VirtualSuggestion:
      type: object
      required: [person, daysSinceLastTouchpoint, reason]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        daysSinceLastTouchpoint:
          type: ["integer", "null"]
        lastTouchpointType:
          type: ["string", "null"]
        reason:
          type: string
        suggestedLeaders:
          type: array
          items:
            $ref: "#/components/schemas/Person"
